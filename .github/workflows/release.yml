name: release

# Publish a multi-arch container image to GHCR whenever a Release is published.
# The image is created automatically on the first push; nothing to pre-provision.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write            # push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # inference-sim/leaderboard (already lowercase)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out leaderboard
        uses: actions/checkout@v4

      # Single source of truth for the repos+refs this image bundles. The README reads
      # the same root .env, so the image and the local-clone instructions cannot drift.
      # actions/checkout wants an owner/repo slug, so strip the URL prefix off BLIS_REPO.
      - name: Pin dependency versions
        run: |
          . ./.env
          {
            echo "BLIS_REF=$BLIS_REF"
            echo "BLIS_CATALOG_REF=$BLIS_CATALOG_REF"
            echo "BLIS_REPO_SLUG=${BLIS_REPO#https://github.com/}"
            echo "BLIS_CATALOG_REPO_SLUG=${BLIS_CATALOG_REPO#https://github.com/}"
          } >> "$GITHUB_ENV"

      - name: Check out blis (upstream)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLIS_REPO_SLUG }}   # from root .env
          ref: ${{ env.BLIS_REF }}
          path: upstream
          fetch-depth: 0                 # full .git — GitProvenance needs real history
          # If inference-sim/inference-sim is PRIVATE, the default GITHUB_TOKEN cannot read
          # it. Provide a PAT or GitHub App token with read access instead:
          # token: ${{ secrets.UPSTREAM_READ_TOKEN }}

      - name: Check out blis-catalog (model catalog)
        # The authoritative model/hardware/workload catalog, a separate repo. Upstream
        # deleted the in-repo model_configs/ tree (inference-sim#1797), so blis now
        # resolves <catalog>/models/<name>/config.json via BLIS_CATALOG with no default.
        # The image bundles this clone; the Dockerfile sets BLIS_CATALOG to it. Small,
        # public, config-only — no history needed.
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BLIS_CATALOG_REPO_SLUG }}   # from root .env
          ref: ${{ env.BLIS_CATALOG_REF }}
          path: blis-catalog

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # incl. image.source -> links package to repo
