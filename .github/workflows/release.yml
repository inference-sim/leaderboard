name: release

# Publish a multi-arch container image to GHCR whenever a Release is published.
# The image is created automatically on the first push; nothing to pre-provision.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write            # push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # inference-sim/leaderboard (already lowercase)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out leaderboard
        uses: actions/checkout@v4

      - name: Check out blis (upstream)
        uses: actions/checkout@v4
        with:
          repository: inference-sim/inference-sim
          path: upstream
          fetch-depth: 0                 # full .git — GitProvenance needs real history
          # If inference-sim/inference-sim is PRIVATE, the default GITHUB_TOKEN cannot read
          # it. Provide a PAT or GitHub App token with read access instead:
          # token: ${{ secrets.UPSTREAM_READ_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # incl. image.source -> links package to repo
