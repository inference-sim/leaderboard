# BLIS leaderboard — OpenShift deployment.
#
# Runs `leaderboard serve` in full-run mode: it serves the web app and the
# read API, and it executes new candidates via POST /api/run by shelling out to
# the upstream `blis` binary. That means the container image must carry, and the
# runtime must provide:
#
#   /app/leaderboard          the server binary (make build)
#   /app/web/dist             the built web app (make web-build); served at /
#                             relative to the process working directory (/app)
#   /app/inference-sim        the upstream checkout, passed as -blis. It must
#                             contain a built ./blis (make blis), defaults.yaml,
#                             hardware_config.json, a .git directory (blis records
#                             the upstream commit and dirty flag as run provenance
#                             via `git`), and the bundled blis-catalog/ — which now
#                             serves only as the seed for the PVC copy (see
#                             BLIS_CATALOG below).
#   git on PATH               used for that provenance capture.
#   writable /tmp             blis run/spec scratch files (emptyDir below).
#   writable /data            results/<group_id>/<run_id>.json, workloads.yaml, and
#                             the model catalog at /data/blis-catalog (the PVC
#                             below); this is the only state that survives a
#                             restart. Putting the catalog here makes it editable:
#                             add a private model by `oc rsh` + writing
#                             /data/blis-catalog/models/<name>/{config.json,model.yaml}.
#
# There is no Dockerfile in this repo yet — build an image that lays the tree out
# as above and set `.spec.template.spec.containers[0].image` to it. A multi-stage
# build (golang + node to compile, then a slim base with git) is the natural shape.
#
# Apply into your project:  oc apply -n <project> -f deploy/openshift/leaderboard.yaml
#
# OpenShift note: nothing here pins a UID or fsGroup. The restricted-v2 SCC
# assigns an arbitrary non-root UID and gid 0, and manages PVC ownership. The
# image must therefore run as an arbitrary UID (group-root-writable dirs), which
# is the OpenShift-standard image contract.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blis-leaderboard-data
  labels:
    app.kubernetes.io/name: blis-leaderboard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Holds results/, workloads.yaml, and now the seeded model catalog plus any
      # private models added by hand — bumped from 1Gi to give that headroom.
      storage: 2Gi
  # storageClassName: <your-class>   # omit to use the cluster default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blis-leaderboard
  labels:
    app.kubernetes.io/name: blis-leaderboard
spec:
  replicas: 1
  # RWO volume + a single writer of results/workloads.yaml: keep one pod. Recreate
  # (not RollingUpdate) so the old pod releases the volume before the new one binds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blis-leaderboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blis-leaderboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Prepare the /data PVC before the server starts. restricted-v2 gives the pod
        # an arbitrary UID plus an fsGroup and chowns the /data PVC to that fsGroup, so
        # /data is group-writable. This:
        #   1. creates the LEADERBOARD_RESULTS subdir with group-write and the setgid
        #      bit, so records written now — and by any future pod in the same fsGroup —
        #      stay writable, and fails the pod loudly if the volume is not writable
        #      rather than surfacing later as a failed /api/run;
        #   2. seeds the model catalog onto the PVC ONCE from the image's bundled clone,
        #      then never clobbers it — so a private model added by hand survives. Moving
        #      the catalog off the read-only image layer is what makes it addable at
        #      runtime: `oc rsh` in and write
        #      /data/blis-catalog/models/<name>/{config.json,model.yaml}. The copy is
        #      staged in a .tmp dir and atomically renamed, so a crash mid-copy leaves no
        #      half-seeded tree that the ONCE guard would then skip. cp -R (not -a) so a
        #      non-root UID is not asked to preserve the image's root ownership (which
        #      would fail under set -eu); g+rwX so a later pod in the same fsGroup can
        #      still edit it. Trade-off: the seed is one-shot, so a newer image's catalog
        #      does NOT propagate to an existing PVC (delete /data/blis-catalog to re-seed).
        - name: seed-data
          image: ghcr.io/inference-sim/leaderboard:0.1.7
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /data/results && chmod 2775 /data/results
              if [ ! -e /data/blis-catalog ]; then
                rm -rf /data/blis-catalog.tmp
                cp -R /app/inference-sim/blis-catalog /data/blis-catalog.tmp
                chmod -R g+rwX /data/blis-catalog.tmp
                mv /data/blis-catalog.tmp /data/blis-catalog
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: leaderboard
          image: ghcr.io/inference-sim/leaderboard:0.1.7
          imagePullPolicy: Always
          workingDir: /app
          env:
            # Upstream blis (#1774) requires an explicit catalog CLONE ROOT — there is
            # no default and no search path — and refuses any run without it. Since
            # inference-sim#1797 the catalog is the separate blis-catalog repo (the old
            # in-repo model_configs/ tree was deleted). The image bundles it at
            # /app/inference-sim/blis-catalog, but that lives on the read-only image
            # layer and cannot take runtime edits; the seed-data initContainer copies it
            # once onto the PVC at /data/blis-catalog, which is where we point blis so a
            # private model can be added by hand (models/<name>/config.json + model.yaml).
            # The server reads this var at startup to build the model list, and every blis
            # subprocess it spawns inherits it (both the run path and the workload-spec
            # validation probe), which -blis/args cannot cover.
            - name: BLIS_CATALOG
              value: /data/blis-catalog
            # Results directory. It lives on the /data PVC (mounted below) so it is
            # the only state that survives a restart. serve reads it via -out, whose
            # default is this env var; keep it inside the /data mount.
            - name: LEADERBOARD_RESULTS
              value: /data/results
          # Set the entrypoint explicitly to the bare binary so `args` below ARE the
          # whole command. Kubernetes appends `args` to the image ENTRYPOINT, so if the
          # image bakes `serve -addr ... -blis ...` into its entrypoint (as older images
          # did), these args would be appended after it — Go's flag parser then stops at
          # the second positional `serve` and silently drops everything after it,
          # including -workloads. Overriding command here makes the launch independent of
          # whatever the image entrypoint bakes in.
          command:
            - leaderboard
          args:
            - serve
            - -addr
            - ":8080"
            - -blis
            - /app/inference-sim
            - -workloads
            - /data/workloads.yaml
            # Cap for a trace upload to /api/traces, in MiB. Real Weka/OTel corpora are far
            # larger than a converted TraceV2, so this is generous; the server keeps only
            # 32 MiB in memory and spills the rest to a temp file, so a large upload streams
            # from disk rather than counting against the memory limit below (it does consume
            # ephemeral storage while it uploads). Requires an image built from code that has
            # the flag (>= 0.1.7); an older binary rejects it and the pod crashloops.
            - -max-upload-mb
            - "4096"
          ports:
            - name: http
              containerPort: 8080
          # /api/results returns 200 with a JSON array even before any run exists,
          # and needs neither web/dist nor blis, so it is the honest health signal.
          readinessProbe:
            httpGet:
              path: /api/results
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/results
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "4"
              memory: 512Mi
            limits:
              # blis runs are CPU-seconds, not GPU; headroom lets a run complete
              # without starving the server. A blis subprocess can spike RSS well
              # past 1Gi (more so with more cores to parallelise over), so the
              # memory limit is sized to absorb that peak rather than OOM-kill it.
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Read-write: /api/run writes results/<group_id>/<run_id>.json and
            # workloads.yaml here (readOnly defaults to false; stated for intent).
            - name: data
              mountPath: /data
              readOnly: false
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blis-leaderboard-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: blis-leaderboard
  labels:
    app.kubernetes.io/name: blis-leaderboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blis-leaderboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# OpenShift-native external exposure. On plain Kubernetes, delete this and use an
# Ingress instead. edge termination gives you HTTPS at the router with plain HTTP
# to the pod; Redirect sends any HTTP request to HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: blis-leaderboard
  labels:
    app.kubernetes.io/name: blis-leaderboard
    # This cluster's custom ingress controller (llmdplanner-ingress-controller)
    # selects the routes it serves by this label; without it the route is admitted
    # but returns 503. Every other app's route in the namespace carries it.
    ingress: llmdplanner
spec:
  to:
    kind: Service
    name: blis-leaderboard
    weight: 100
  port:
    # Numeric, not the named port "http": the controller serves routes whose
    # targetPort is the numeric container port, matching the other apps here.
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Second route on the internal VPC domain, mirroring the peer `planner-vpc` route.
# This is the host reachable from inside the IBM Cloud VPC.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: blis-leaderboard-vpc
  labels:
    app.kubernetes.io/name: blis-leaderboard
    ingress: llmdplanner
spec:
  host: blis-leaderboard-llmdplanner.llmdplanner.vpc.res.ibm.com
  to:
    kind: Service
    name: blis-leaderboard
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
